<svg
  xmlns="http://www.w3.org/2000/svg"
  width="100%"
  viewBox="0 0 720 320"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">ABBAS // SYSTEM 01</title>
  <desc id="description">Developer Telemetry and Orbit System for Abbas</desc>

  <style>
    text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
    .micro {
      font-size: 8px;
      letter-spacing: 1.8px;
      fill: #8b949e;
    }
    .tiny {
      font-size: 7px;
      letter-spacing: 1.4px;
      fill: #6e7681;
    }
    .telemetry {
      font-size: 9px;
      letter-spacing: 1.5px;
      fill: #58a6ff;
    }
    .designation {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2.4px;
      fill: #f0f6fc;
    }
  </style>

  <!-- background -->
  <rect width="720" height="320" fill="#0d1117" rx="6" />

  <!-- registration marks -->
  <g fill="none" stroke="#30363d" stroke-width="1">
    <path d="M18 34V18H34" />
    <path d="M686 18H702V34" />
    <path d="M18 286V302H34" />
    <path d="M686 302H702V286" />

    <line x1="360" y1="18" x2="360" y2="25" />
    <line x1="360" y1="295" x2="360" y2="302" />
    <line x1="18" y1="148" x2="25" y2="148" />
    <line x1="695" y1="148" x2="702" y2="148" />
  </g>

  <!-- instrument designation -->
  <text x="32" y="38" class="designation">ABBAS // DEV-CORE 01</text>
  <text x="32" y="52" class="tiny">COMPUTER ENG · ISFAHAN UNIV. OF TECHNOLOGY</text>

  <text x="688" y="38" text-anchor="end" class="micro">STATUS // ONLINE</text>
  <text x="688" y="52" text-anchor="end" class="tiny">SYSTEM // PRODUCTION</text>

  <!-- central calibration axes -->
  <g stroke="#21262d" stroke-width="0.7">
    <line x1="180" y1="148" x2="540" y2="148" />
    <line x1="360" y1="60" x2="360" y2="236" />
  </g>

  <!-- orbit system -->
  <g>
    <!-- Orbit 1: Frontend (Cyan) -->
    <g transform="rotate(-12 360 148)">
      <ellipse cx="360" cy="148" rx="122" ry="40" fill="none" stroke="#38bdf8" stroke-width="1.1" stroke-opacity="0.55" />
    </g>
    <circle cx="252" cy="168" r="3.5" fill="#38bdf8" />
    <circle cx="252" cy="168" r="7" fill="none" stroke="#38bdf8" stroke-opacity="0.25" />

    <!-- Orbit 2: Backend & DB (Emerald) -->
    <g transform="rotate(48 360 148)">
      <ellipse cx="360" cy="148" rx="136" ry="46" fill="none" stroke="#34d399" stroke-width="1.1" stroke-opacity="0.55" />
    </g>
    <circle cx="336" cy="188" r="3.5" fill="#34d399" />
    <circle cx="336" cy="188" r="7" fill="none" stroke="#34d399" stroke-opacity="0.25" />

    <!-- Orbit 3: Core & Systems (Amber) -->
    <g transform="rotate(-52 360 148)">
      <ellipse cx="360" cy="148" rx="146" ry="54" fill="none" stroke="#fbbf24" stroke-width="1.1" stroke-opacity="0.55" />
    </g>
    <circle cx="438" cy="128" r="3.5" fill="#fbbf24" />
    <circle cx="438" cy="128" r="7" fill="none" stroke="#fbbf24" stroke-opacity="0.25" />

    <!-- targeting reticle -->
    <circle cx="360" cy="148" r="24" fill="none" stroke="#30363d" stroke-width="0.8" stroke-dasharray="2 4" />
    <circle cx="360" cy="148" r="48" fill="none" stroke="#21262d" stroke-width="0.6" stroke-dasharray="1 6" />

    <!-- nucleus -->
    <circle cx="360" cy="148" r="11" fill="#1f6feb" />
    <circle cx="360" cy="148" r="11" fill="none" stroke="#58a6ff" stroke-width="1" />
    <circle cx="360" cy="148" r="2.5" fill="#ffffff" />
  </g>

  <!-- telemetry guides & lines -->
  <g fill="none" stroke="#30363d" stroke-width="0.6" opacity="0.6">
    <path d="M 120 120 H 168 L 252 168" />
    <path d="M 600 120 H 552 L 438 128" />
    <path d="M 120 186 H 180 L 336 188" />
    <path d="M 600 186 H 540 L 360 148" />
  </g>

  <!-- terminals -->
  <g fill="#58a6ff">
    <circle cx="252" cy="168" r="1.5" />
    <circle cx="438" cy="128" r="1.5" />
    <circle cx="336" cy="188" r="1.5" />
    <circle cx="360" cy="148" r="1.5" />
  </g>

  <!-- Left Telemetry labels -->
  <text x="68" y="113" class="telemetry">FE // NEXT.JS · REACT · TAILWIND</text>
  <line x1="68" y1="120" x2="120" y2="120" stroke="#30363d" />

  <text x="68" y="179" class="telemetry">SYS // C · C++ · ARCHITECTURE</text>
  <line x1="68" y1="186" x2="120" y2="186" stroke="#30363d" />

  <!-- Right Telemetry labels -->
  <text x="652" y="113" text-anchor="end" class="telemetry">BE // PRISMA · POSTGRESQL · SQL</text>
  <line x1="600" y1="120" x2="652" y2="120" stroke="#30363d" />

  <text x="652" y="179" text-anchor="end" class="telemetry">FLOW // GIT · MODERN WEB DEV</text>
  <line x1="600" y1="186" x2="652" y2="186" stroke="#30363d" />

  <!-- signal trace waves -->
  <polyline
    points="160,256 180,254 200,258 220,252 240,255 260,250 280,256 300,248 320,254 340,249 360,252 380,248 400,255 420,250 440,256 460,251 480,257 500,252 520,255 540,253 560,256"
    fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.35"
  />
  <polyline
    points="160,259 180,261 200,258 220,262 240,257 260,263 280,259 300,262 320,258 340,263 360,260 380,264 400,259 420,263 440,258 460,262 480,259 500,263 520,260 540,262 560,259"
    fill="none" stroke="#34d399" stroke-width="0.75" stroke-opacity="0.35"
  />

  <!-- footer -->
  <text x="32" y="292" class="micro">COORD // 32.65°N 51.66°E [ISFAHAN]</text>
  <text x="688" y="292" text-anchor="end" class="micro">ABBAS2026 // OBSERVATORY PROTOCOL</text>

  <text x="32" y="306" class="tiny">STACK // WEB ARCHITECTURE &amp; SYSTEMS</text>
  <text x="688" y="306" text-anchor="end" class="tiny">NODE // ONLINE</text>
</svg>
